[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "format_conversation_dataset"
version = "0.2.0"
description = "Source-preserving conversational datasets with response boundaries and completion-only training masks."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
tokenize = ["transformers>=5,<6", "jinja2>=3.1"]

[project.scripts]
conversation-dataset = "format_conversation_dataset.cli:main"

[tool.setuptools.packages.find]
include = ["format_conversation_dataset*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
